<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>User Tasks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="container">
    <h1>User Tasks</h1>

    <section id="auth">
      <div class="card">
        <h2>Registro</h2>
        <input id="reg-name" placeholder="Nombre" />
        <input id="reg-email" placeholder="Email" type="email" />
        <input id="reg-pass" placeholder="Password" type="password" />
        <button id="btn-register">Crear cuenta</button>
        <p class="msg" id="reg-msg"></p>
      </div>

      <div class="card">
        <h2>Login</h2>
        <input id="log-email" placeholder="Email" type="email" />
        <input id="log-pass" placeholder="Password" type="password" />
        <button id="btn-login">Entrar</button>
        <p class="msg" id="log-msg"></p>
      </div>
    </section>

    <section id="app" class="hidden">
      <div class="bar">
        <span id="hello"></span>
        <button id="btn-logout">Salir</button>
      </div>

      <div class="card">
        <h2>Nueva tarea</h2>
        <input id="task-title" placeholder="Título" />
        <textarea id="task-desc" placeholder="Descripción (opcional)"></textarea>
        <button id="btn-add">Agregar</button>
        <p class="msg" id="add-msg"></p>
      </div>

      <div class="card">
        <h2>Mis tareas</h2>
        <ul id="task-list"></ul>
      </div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
